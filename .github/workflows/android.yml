name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    # EXPO_PUBLIC_* values are inlined into the JS bundle, which Gradle creates
    # during assemble/bundle — NOT during prebuild. They must be set job-wide or
    # the shipped app gets `undefined` with no build-time warning.
    env:
      EXPO_PUBLIC_API_URL: https://safe-date-ai-1.replit.app

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node + pnpm ─────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Java 17 (required by Android Gradle plugin) ─────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Expo prebuild (generates the android/ native project) ───────────────
      - name: Prebuild Android native project
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/mobile/android/**/*.gradle*', 'artifacts/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Build APK ───────────────────────────────────────────────────────────
      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: github.event.inputs.build_type == 'release'
        working-directory: artifacts/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > loopin.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/loopin.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build release AAB for Google Play (signed)
        if: github.event.inputs.build_type == 'release'
        working-directory: artifacts/mobile/android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/loopin.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── Post-build gate: sign-in must be reachable ──────────────────────────
      # A release build whose bundle points at the production API but has no
      # Clerk proxy path ships a blank screen: the live Clerk instance's own
      # frontend-api host does not answer, so all auth traffic must go through
      # the server's /api/__clerk proxy. Four such builds reached a real phone
      # before this check existed — fail the job instead.
      - name: Verify release bundle can reach sign-in
        if: github.event.inputs.build_type == 'release'
        working-directory: artifacts/mobile/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -o -j "$APK" assets/index.android.bundle -d /tmp/bundle-check
          BUNDLE=/tmp/bundle-check/index.android.bundle
          if grep -q -e 'pk_live_' -e "$EXPO_PUBLIC_API_URL" "$BUNDLE"; then
            if ! grep -q '/api/__clerk' "$BUNDLE"; then
              echo "::error::Release bundle targets a live Clerk key / production API" \
                   "but contains no '/api/__clerk' proxy path. This build would hang" \
                   "on a blank screen at sign-in. Refusing to ship it."
              exit 1
            fi
            echo "OK: bundle targets production and includes the /api/__clerk proxy path."
          else
            echo "OK: bundle does not reference a live key or the production API URL."
          fi

      # ── Upload APK ──────────────────────────────────────────────────────────
      - name: Upload debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: loopin-debug-${{ github.run_number }}
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: loopin-release-${{ github.run_number }}
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload release AAB (for Google Play)
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: loopin-release-aab-${{ github.run_number }}
          path: artifacts/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
